    border-bottom: 2px solid #c4a882;
    page-break-after: avoid;
  }

  .gallery-row {
    display: flex; flex-wrap: wrap; gap: 8px;
    align-items: flex-start;
  }
  .gallery-row .img-wrap {
    break-inside: avoid;
    border-radius: 2px; overflow: hidden;
    background: #f5f5f5;
  }
  .gallery-row .img-wrap img {
    display: block; height: 200px; width: auto;
  }
  .gallery-row .img-wrap.portrait img { height: 240px; }

  @media print {
    body { padding: 0; }
    .cat-title { margin-top: 20px; }
  }

  ]},

const app = document.getElementById('app');

categories.forEach(cat => {
  const title = document.createElement('div');
  title.className = 'cat-title';
  title.textContent = cat.name;
  app.appendChild(title);

  const row = document.createElement('div');
  row.className = 'gallery-row';
  row.id = 'row-' + cat.id;
  app.appendChild(row);
});

function renderCat(cat) {
  const row = document.getElementById('row-' + cat.id);
  const items = [];
  let loaded = 0;
  cat.files.forEach(file => {
    const img = new Image();
    img.onload = function() {
      items.push({ file, portrait: img.naturalHeight > img.naturalWidth });
      loaded++;
      if (loaded === cat.files.length) {
        items.sort((a,b) => (a.portrait ? 1 : 0) - (b.portrait ? 1 : 0));
        items.forEach(item => {
          const wrap = document.createElement('div');
          wrap.className = 'img-wrap' + (item.portrait ? ' portrait' : '');
          wrap.innerHTML = '<img src="' + encodeURI(basePath + item.file) + '">';
          row.appendChild(wrap);
        });
      }
    };
    img.onerror = function() { loaded++; };
    img.src = encodeURI(basePath + file);
  });
}

categories.forEach(renderCat);
</script>
